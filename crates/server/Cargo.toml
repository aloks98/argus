[package]
name = "argus-server"
description = "Argus control plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "argus"

[[bin]]
name = "argus"
path = "src/main.rs"

[dependencies]
argus-proto.workspace = true
argus-common.workspace = true

tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true

axum.workspace = true
tower-http.workspace = true
rust-embed.workspace = true
futures-util.workspace = true

sqlx.workspace = true

rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
rustls-pemfile.workspace = true
openidconnect.workspace = true
reqwest.workspace = true
axum-extra.workspace = true

serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
time.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

aes-gcm.workspace = true
sha2.workspace = true
base64.workspace = true
hex.workspace = true
x509-parser.workspace = true
rand.workspace = true

[dev-dependencies]
# For parsing PEM in tests only; `rcgen`/`x509-parser` already pull in `pem`
# transitively, but Rust requires a direct dependency to `use` a crate.
pem = "3"
# For driving the axum router directly in tests via `ServiceExt::oneshot`,
# without binding a socket.
tower = { version = "0.5", features = ["util"] }
