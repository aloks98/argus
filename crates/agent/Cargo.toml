[package]
name = "argus-agent"
description = "Argus guest agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "argus-agent"
path = "src/main.rs"

[dependencies]
argus-proto.workspace = true
argus-common.workspace = true

tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true

rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
rustls-pemfile.workspace = true
# sha256 for self-update verification — same crypto stack as rustls
ring.workspace = true

anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

rand.workspace = true
# "fs" adds rustix::fs::renameat_with (renameat2/RENAME_EXCHANGE) for the
# atomic self-update binary swap, on top of the "system" uname use in info.rs.
rustix = { workspace = true, features = ["fs"] }
x509-parser.workspace = true
sysinfo.workspace = true

# Per-slice deps are added when their slice is built (keeps the agent lean):
portable-pty = "0.9"

# Docker slice: local daemon over its unix socket only (never TCP/TLS), so the
# `pipe` feature (hyperlocal) is all we need — no openssl/cmake, ring-only.
bollard = { version = "0.19", default-features = false, features = ["pipe"] }

# Systemd slice: D-Bus to the local system bus. `default-features = false` +
# `tokio` is load-bearing — zbus defaults to the async-io/smol reactor, and the
# agent must not carry a second runtime. Verified static-pie on
# x86_64-unknown-linux-musl with no async-io/async-std in the tree.
# `zvariant` supplies the D-Bus type derives, `serde` the Deserialize they build
# on, and `futures-util` the StreamExt used to await JobRemoved signals.
zbus = { version = "5.12", default-features = false, features = ["tokio"] }
zvariant = "5.8"
futures-util = "0.3"
serde.workspace = true

# Log slice: the journal is read by spawning `journalctl -o json` (linking
# libsystemd would break the static-musl build, and systemd exposes no stable
# D-Bus API for journal *content*), so the agent needs a JSON parser to map
# those records. `tokio`'s "full" features already supply `tokio::process`.
serde_json.workspace = true
