# Forgejo Actions CI for Argus.
#
# Two-stage layout: `checks` is the fast-fail gate (formatting + lint +
# typecheck, no builds, no database) on the small runner; `build-test` does
# the heavy compile/test work on medium, in parallel when runner capacity
# allows. Both use catthehacker's Rust image (rustc/cargo/rustfmt/clippy +
# node + git + gcc/make preinstalled).
#
# pnpm is installed via `npm i -g`, not corepack: newer Node builds dropped
# bundled corepack, and the runner image's Node version is not pinned by us.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# act_runner executes container-job run steps with `sh` (dash) unless told
# otherwise -- every `set -euo pipefail` (a bashism) then dies instantly with
# "Illegal option -o pipefail". Uncontainerized jobs happened to get bash,
# which is why only container jobs failed. Pin bash for every step.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: small
    container:
      image: catthehacker/ubuntu:rust-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Frontend lint + format + typecheck
        run: |
          npm install -g pnpm@11.17.0
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run fmt:check
          pnpm --dir frontend run lint
          pnpm --dir frontend run typecheck

      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Helm lint + template
        run: |
          if ! command -v helm >/dev/null; then
            curl -fsSL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz | tar xz -C /tmp
            install /tmp/linux-amd64/helm /usr/local/bin/helm
          fi
          helm lint deploy/chart/argus
          helm template argus deploy/chart/argus > /dev/null
          helm template argus deploy/chart/argus --set ingress.mode=traefik --set ingress.host=x.test > /dev/null
          helm template argus deploy/chart/argus --set ingress.mode=ingress --set ingress.host=x.test > /dev/null

  build-test:
    runs-on: medium
    container:
      image: catthehacker/ubuntu:rust-24.04
    env:
      # Postgres is started inside this job's container (see "Start Postgres") and
      # reached over localhost. This deliberately avoids a `services:` container,
      # whose name resolution depends on the act_runner's network mode.
      DATABASE_URL: postgres://postgres:argus@localhost:5432/argus
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Postgres
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql
          PGVER=$(ls /etc/postgresql | sort -V | tail -1)
          pg_ctlcluster "$PGVER" main start || true
          for i in $(seq 1 30); do pg_isready -h localhost -p 5432 && break; sleep 1; done
          su postgres -c "psql -v ON_ERROR_STOP=1 -c \"ALTER USER postgres PASSWORD 'argus';\""
          su postgres -c "psql -v ON_ERROR_STOP=1 -c \"CREATE DATABASE argus;\""

      # The server embeds frontend/dist via rust-embed, so it MUST exist before any
      # cargo build/clippy/test of the workspace. Lint/typecheck live in `checks`.
      - name: Build the embedded frontend
        run: |
          npm install -g pnpm@11.17.0
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run build

      # Uses the committed .sqlx offline cache, so no database is needed here.
      - name: Clippy (deny warnings)
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Guards against a stale committed query cache: fails if a query! changed
      # without `cargo sqlx prepare` being re-run. Needs the live schema.
      - name: Verify the .sqlx offline cache is current
        run: |
          cargo install sqlx-cli --version ^0.9 --no-default-features --features rustls,postgres --locked
          sqlx migrate run --source crates/server/migrations
          cargo sqlx prepare --workspace --check -- --all-targets

      - name: Test (unit + sqlx::test + live-DB integration)
        run: |
          cargo test --workspace
          # `--skip live_` is load-bearing — do not drop it. Most #[ignore]d tests
          # only need the live Postgres this job already provisions, so they must
          # still run here. The exception is the `live_*` tests, which need a real
          # systemd host: a D-Bus system bus, a readable journal, and root for the
          # polkit-guarded unit verb. This runner is a container with none of
          # those, so without the skip they fail every run. Skipping by name (not
          # by package) keeps workspace-wide coverage, so a new ignored test in
          # any crate is still picked up. The live_* set is a manual real-host
          # gate instead — see docs/DEV.md.
          cargo test --workspace -- --ignored --skip live_

  # The agent must ship as a fully static binary for Flatcar (CLAUDE.md standing
  # convention). This builds it for the musl target and asserts it's static, so a
  # dependency that breaks the static build is caught here rather than at deploy.
  agent-musl:
    runs-on: medium
    container:
      image: catthehacker/ubuntu:rust-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install musl toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Build the static agent (Flatcar target)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build -p argus-agent --release --target x86_64-unknown-linux-musl

      - name: Assert the agent binary is statically linked
        env:
          BIN: target/x86_64-unknown-linux-musl/release/argus-agent
        run: |
          file "$BIN"
          file "$BIN" | grep -qi 'static' || { echo "ERROR: agent is not statically linked"; exit 1; }

  # PR-time guard: prove both Dockerfiles still build before merge, without
  # pushing anything anywhere (no ghcr auth needed here -- that's the release
  # workflow's job). Skips entirely on non-PR events and on PRs that don't
  # touch anything the images depend on, since a full server image build is a
  # release compile and not cheap.
  #
  # NOT YET EMPIRICALLY VERIFIED (task-2 constraint: the daemon question is
  # runner-specific and can't be tested from this dev box) -- confirm on the
  # first real PR that touches deploy/docker/**:
  #   `container:` puts the job's steps inside catthehacker/ubuntu:act-24.04,
  #   and `docker build` there only works if that container can reach a
  #   docker daemon (e.g. the runner host's /var/run/docker.sock bind-mounted
  #   in, or docker-in-docker). If `docker build` fails with something like
  #   "Cannot connect to the Docker daemon" / "docker: command not found",
  #   the large runner does NOT expose a daemon to job containers -- drop the
  #   `container:` key entirely so this job runs directly on the runner host
  #   instead (which does have docker; see CLAUDE.md / constraints.md: "docker
  #   IS available on this dev box", true for the runner host too).
  docker-build:
    runs-on: large
    if: ${{ github.event_name == 'pull_request' }}
    container:
      image: catthehacker/ubuntu:act-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect docker/package changes
        id: filter
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=50
          # Two-dot (not triple-dot): triple-dot needs a merge-base, which two
          # disconnected depth-limited fetches (this shallow clone + the base
          # ref's own shallow fetch above) often can't produce -- that failure
          # happened silently before, because this used to run inside the `if`
          # below where errexit doesn't apply, so a git error fell through to
          # the else branch and skipped the build with a green check. The
          # capture below is a bare statement (not inside an `if`), so
          # `set -e` kills the step on any git failure instead.
          files=$(git diff --name-only "origin/${{ github.base_ref }}" HEAD)
          if echo "$files" | grep -qE '^(deploy/docker/|\.dockerignore|Cargo\.(toml|lock)|crates/|frontend/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build images (no push)
        if: steps.filter.outputs.changed == 'true'
        run: |
          docker build -f deploy/docker/Dockerfile.server -t argus:ci .
          docker build -f deploy/docker/Dockerfile.agent -t argus-agent:ci .
