# Forgejo Actions CI for Argus.
#
# Two-stage layout: `checks` is the fast-fail gate (formatting + lint +
# typecheck, no builds, no database) on the small runner; `build-test` does
# the heavy compile/test work on medium, in parallel when runner capacity
# allows. Both use catthehacker's Rust image (rustc/cargo/rustfmt/clippy +
# node + git + gcc/make preinstalled).
#
# PR jobs are skipped by changed area: the `changes` job diffs the PR once
# and every other job gates on its outputs, so a docs-only PR runs nothing
# heavy and a frontend-only PR compiles no Rust. Pushes to main NEVER skip
# -- the merge commit always gets the full gate.
#
#   area      paths                                              gates
#   rust      crates/, Cargo.toml|lock, .sqlx/, rust-toolchain   build-test, agent-musl, rustfmt
#   frontend  frontend/                                          frontend checks (+build when rust won't)
#   chart     deploy/chart/                                      helm lint
#   docker    deploy/docker/, .dockerignore, + rust + frontend   docker-build
#   .forgejo/ (workflow change)                                  everything
#
# pnpm is installed via `npm i -g`, not corepack: newer Node builds dropped
# bundled corepack, and the runner image's Node version is not pinned by us.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# act_runner executes container-job run steps with `sh` (dash) unless told
# otherwise -- every `set -euo pipefail` (a bashism) then dies instantly with
# "Illegal option -o pipefail". Uncontainerized jobs happened to get bash,
# which is why only container jobs failed. Pin bash for every step.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which areas this event touches, computed ONCE; every other job gates on
  # these outputs. Uncontainerized ON PURPOSE: job containers on this runner
  # cannot write $GITHUB_OUTPUT (bisection-confirmed during the
  # release-pipeline rehearsals; same reason release.yml's `version` job is
  # uncontainerized -- and its cross-job outputs are proven to work).
  #
  # `large`, NOT `small` (empirically confirmed, run #122): a container-less
  # job on `small` runs in act_runner's default node:24-bookworm-slim image,
  # which has NO git -- checkout@v4 silently falls back to a REST tarball
  # (no .git dir) and the `git fetch` below dies with exit 127. `large` maps
  # to host mode (same reason docker-build's `docker` works there), where
  # git is real. Cost: every PR push briefly holds the large runner; it's a
  # <30s job.
  changes:
    runs-on: large
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      chart: ${{ steps.filter.outputs.chart }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect changed areas
        id: filter
        run: |
          set -euo pipefail
          all() { for k in rust frontend chart docker; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; }
          # Pushes to main are merges: never skip the full gate there. Only
          # PR iteration -- where the same commits rebuild push after push --
          # is worth trimming.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            all
            exit 0
          fi
          git fetch origin "${{ github.base_ref }}" --depth=50
          # Two-dot (not triple-dot): triple-dot needs a merge-base, which two
          # disconnected depth-limited fetches (this shallow clone + the base
          # ref's own shallow fetch above) often can't produce. Two-dot can
          # over-report (files changed on main since the branch diverged),
          # which errs toward RUNNING jobs -- the safe direction. The capture
          # is a bare statement (not inside an `if`, where errexit doesn't
          # apply), so `set -e` kills the step on any git failure instead of
          # silently skipping work with a green check.
          files=$(git diff --name-only "origin/${{ github.base_ref }}" HEAD)
          echo "changed files:"; echo "$files"
          # A workflow change invalidates every skip decision below: run it all.
          if echo "$files" | grep -qE '^\.forgejo/'; then
            all
            exit 0
          fi
          has() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          echo "rust=$(has '^(crates/|Cargo\.(toml|lock)$|\.sqlx/|rust-toolchain\.toml$)')" >> "$GITHUB_OUTPUT"
          echo "frontend=$(has '^frontend/')" >> "$GITHUB_OUTPUT"
          echo "chart=$(has '^deploy/chart/')" >> "$GITHUB_OUTPUT"
          # Same set docker-build's inline filter used to test: anything the
          # images depend on, not just the Dockerfiles.
          echo "docker=$(has '^(deploy/docker/|\.dockerignore$|Cargo\.(toml|lock)$|crates/|frontend/)')" >> "$GITHUB_OUTPUT"

  checks:
    needs: changes
    # Skipped entirely (no container spin-up) when no lintable area changed.
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.chart == 'true'
    runs-on: small
    container:
      image: catthehacker/ubuntu:rust-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Frontend lint + format + typecheck
        if: needs.changes.outputs.frontend == 'true'
        run: |
          npm install -g pnpm@11.17.0
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run fmt:check
          pnpm --dir frontend run lint
          pnpm --dir frontend run typecheck

      # Only when build-test won't run: that job builds the frontend anyway
      # (the embed needs it), so this step exists exactly for frontend-only
      # PRs, where a broken `vite build` would otherwise reach main unseen.
      - name: Frontend production build (frontend-only PRs)
        if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.rust != 'true'
        run: pnpm --dir frontend run build

      - name: Rustfmt
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all --check

      - name: Helm lint + template
        if: needs.changes.outputs.chart == 'true'
        run: |
          if ! command -v helm >/dev/null; then
            curl -fsSL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz | tar xz -C /tmp
            install /tmp/linux-amd64/helm /usr/local/bin/helm
          fi
          helm lint deploy/chart/argus
          helm template argus deploy/chart/argus > /dev/null
          helm template argus deploy/chart/argus --set ingress.mode=traefik --set ingress.host=x.test > /dev/null
          helm template argus deploy/chart/argus --set ingress.mode=ingress --set ingress.host=x.test > /dev/null

  # Gated on rust only: a frontend-only change can't alter workspace
  # compilation or tests (rust-embed includes whatever dist holds; its
  # contents are not exercised by the test suite), and the frontend build
  # itself is covered by `checks` on those PRs.
  build-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: medium
    container:
      image: catthehacker/ubuntu:rust-24.04
    env:
      # Postgres is started inside this job's container (see "Start Postgres") and
      # reached over localhost. This deliberately avoids a `services:` container,
      # whose name resolution depends on the act_runner's network mode.
      DATABASE_URL: postgres://postgres:argus@localhost:5432/argus
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Postgres
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql
          PGVER=$(ls /etc/postgresql | sort -V | tail -1)
          pg_ctlcluster "$PGVER" main start || true
          for i in $(seq 1 30); do pg_isready -h localhost -p 5432 && break; sleep 1; done
          su postgres -c "psql -v ON_ERROR_STOP=1 -c \"ALTER USER postgres PASSWORD 'argus';\""
          su postgres -c "psql -v ON_ERROR_STOP=1 -c \"CREATE DATABASE argus;\""

      # The server embeds frontend/dist via rust-embed, so it MUST exist before any
      # cargo build/clippy/test of the workspace. Lint/typecheck live in `checks`.
      - name: Build the embedded frontend
        run: |
          npm install -g pnpm@11.17.0
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run build

      # Uses the committed .sqlx offline cache, so no database is needed here.
      - name: Clippy (deny warnings)
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Guards against a stale committed query cache: fails if a query! changed
      # without `cargo sqlx prepare` being re-run. Needs the live schema.
      - name: Verify the .sqlx offline cache is current
        run: |
          cargo install sqlx-cli --version ^0.9 --no-default-features --features rustls,postgres --locked
          sqlx migrate run --source crates/server/migrations
          cargo sqlx prepare --workspace --check -- --all-targets

      - name: Test (unit + sqlx::test + live-DB integration)
        run: |
          cargo test --workspace
          # `--skip live_` is load-bearing — do not drop it. Most #[ignore]d tests
          # only need the live Postgres this job already provisions, so they must
          # still run here. The exception is the `live_*` tests, which need a real
          # systemd host: a D-Bus system bus, a readable journal, and root for the
          # polkit-guarded unit verb. This runner is a container with none of
          # those, so without the skip they fail every run. Skipping by name (not
          # by package) keeps workspace-wide coverage, so a new ignored test in
          # any crate is still picked up. The live_* set is a manual real-host
          # gate instead — see docs/DEV.md.
          cargo test --workspace -- --ignored --skip live_

  # The agent must ship as a fully static binary for Flatcar (CLAUDE.md standing
  # convention). This builds it for the musl target and asserts it's static, so a
  # dependency that breaks the static build is caught here rather than at deploy.
  agent-musl:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: medium
    container:
      image: catthehacker/ubuntu:rust-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # User request: the musl std target (~30MB via rustup) and the cargo
      # registry re-download on every run. actions/cache needs act_runner's
      # cache server; if it's unavailable the step degrades to a warning and
      # the job still passes -- verified by rehearsal either way.
      - name: Cache musl target + cargo registry
        uses: actions/cache@v4
        with:
          # The cargo registry ONLY. Do NOT cache the rustup target dir: the
          # component's files without rustup's manifest make the next
          # `rustup target add` fail with "detected conflict" (rustup finds
          # files it didn't install). Learned the hard way on run #97; the
          # v2 key prefix retires the poisoned entries.
          path: ~/.cargo/registry
          key: cargo-registry-v2-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-v2-

      - name: Install musl toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends musl-tools
          # Self-heal: if rustup doesn't list the target but stray files
          # exist (poisoned cache, reused runner), remove them first or
          # `target add` refuses with "detected conflict".
          if ! rustup target list --installed | grep -q x86_64-unknown-linux-musl; then
            rm -rf "$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-musl"
          fi
          rustup target add x86_64-unknown-linux-musl

      - name: Build the static agent (Flatcar target)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build -p argus-agent --release --target x86_64-unknown-linux-musl

      - name: Assert the agent binary is statically linked
        env:
          BIN: target/x86_64-unknown-linux-musl/release/argus-agent
        run: |
          file "$BIN"
          file "$BIN" | grep -qi 'static' || { echo "ERROR: agent is not statically linked"; exit 1; }

  # PR-time guard: prove both Dockerfiles still build before merge, without
  # pushing anything anywhere (no ghcr auth needed here -- that's the release
  # workflow's job). PR-only, and gated on the `docker` area from `changes`
  # (which owns the diff logic this job used to carry inline), since a full
  # server image build is a release compile and not cheap.
  #
  # NOT YET EMPIRICALLY VERIFIED (task-2 constraint: the daemon question is
  # runner-specific and can't be tested from this dev box) -- confirm on the
  # first real PR that touches deploy/docker/**:
  #   `container:` puts the job's steps inside catthehacker/ubuntu:act-24.04,
  #   and `docker build` there only works if that container can reach a
  #   docker daemon (e.g. the runner host's /var/run/docker.sock bind-mounted
  #   in, or docker-in-docker). If `docker build` fails with something like
  #   "Cannot connect to the Docker daemon" / "docker: command not found",
  #   the large runner does NOT expose a daemon to job containers -- drop the
  #   `container:` key entirely so this job runs directly on the runner host
  #   instead (which does have docker; see CLAUDE.md / constraints.md: "docker
  #   IS available on this dev box", true for the runner host too).
  docker-build:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true'
    runs-on: large
    # No `container:` here ON PURPOSE: on this runner, job containers (a)
    # cannot reach the docker daemon and (b) cannot write $GITHUB_OUTPUT --
    # both bisection-confirmed during the release-pipeline rehearsals.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build images (no push)
        run: |
          docker build -f deploy/docker/Dockerfile.server -t argus:ci .
          docker build -f deploy/docker/Dockerfile.agent -t argus-agent:ci .
