[workspace]
resolver = "2"
members = ["crates/proto", "crates/common", "crates/server", "crates/agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-only"

[workspace.dependencies]
# Internal crates
argus-proto = { path = "crates/proto" }
argus-common = { path = "crates/common" }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# gRPC (tonic 0.14 split the prost codec into tonic-prost / tonic-prost-build)
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"
tonic-prost-build = "0.14"
protox = "0.9"

# TLS + internal CA. Pinned to the `ring` crypto provider everywhere so the build
# needs only a C compiler (aws-lc-rs would pull in cmake, which isn't guaranteed).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", features = ["x509-parser"] } # defaults already select ring + pem + crypto
rustls-pemfile = "2"

# OIDC for the browser surface. `default-features` are already ["reqwest",
# "rustls-tls"]; reqwest is declared explicitly alongside it only to add
# native-roots, so an IdP behind an internal CA (a homelab norm) is reachable.
# NEVER enable openidconnect's `native-tls` feature -- that is OpenSSL.
openidconnect = "4"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "json",
] }
axum-extra = { version = "0.10", features = ["cookie"] }

# Browser HTTP surface + embedded frontend
axum = { version = "0.8", features = ["ws"] }
# `compression-gzip` (flate2/miniz_oxide, pure Rust) serves the embedded SPA
# bundle compressed; applied to the static fallback only (see http::router).
tower-http = { version = "0.7", features = ["trace", "compression-gzip"] }
rust-embed = "8"
# StreamExt/SinkExt for splitting a WebSocket into concurrent send/recv halves.
futures-util = "0.3"

# Postgres. Compile-time-checked queries; ring TLS to match the rest of the stack.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "time",
    "json",
] }

# Utility
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "serde-well-known"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Spine slice: field encryption, hashing, cert/identity parsing, agent host facts
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
x509-parser = "0.16"
rand = "0.9"
rustix = { version = "1", features = ["system"] }

# Local admin password hashing. Pure Rust (no -sys crates, no OpenSSL, no cmake).
argon2 = { version = "0.5", features = ["std"] }

# Metrics slice: host CPU/mem/swap/load/disk/net/uptime sampling
sysinfo = "0.39"

[profile.release]
lto = "thin"
strip = true
