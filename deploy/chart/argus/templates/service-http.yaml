apiVersion: v1
kind: Service
metadata:
  name: {{ include "argus.fullname" . }}-http
  labels:
    {{- include "argus.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "argus.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.http.port }}
      targetPort: http
      protocol: TCP
