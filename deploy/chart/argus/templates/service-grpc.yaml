apiVersion: v1
kind: Service
metadata:
  name: {{ include "argus.fullname" . }}-grpc
  labels:
    {{- include "argus.labels" . | nindent 4 }}
spec:
  # Agent mTLS surface. mTLS terminates IN THE POD -- routing this through
  # an HTTP proxy/ingress would break client-certificate verification (PRD
  # §2.4, decisions-that-must-not-be-reopened). Always a dedicated
  # LoadBalancer, never fronted by Traefik/Ingress.
  type: LoadBalancer
  {{- if .Values.grpc.loadBalancerIP }}
  loadBalancerIP: {{ .Values.grpc.loadBalancerIP }}
  {{- end }}
  selector:
    {{- include "argus.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.grpc.port }}
      targetPort: grpc
      protocol: TCP
